{{- $name := default .Chart.Name .Values.nameOverride -}}
{{- $fullname := include "artemis.fullname" . -}}
{{- $releaseName := printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" -}}
{{- $releaseNamespace := .Release.Namespace -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "artemis.fullname" . }}
  labels:
{{ include "artemis.labels" . | indent 4 }}
data:
  broker.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="no"?>
    <configuration xmlns="urn:activemq" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="urn:activemq /schema/artemis-configuration.xsd" xmlns:xi="http://www.w3.org/2001/XInclude">
      <core xmlns="urn:activemq:core" xsi:schemaLocation="urn:activemq:core ">

        <xi:include href="etc/connectors.xml"/>
        <xi:include href="etc/acceptors.xml"/>

        <xi:include href="etc/addresses.xml"/>
        <xi:include href="etc/address-settings.xml" />
        <xi:include href="etc/security-settings.xml" />
        <xi:include href="etc/broker-plugins.xml" />
        {{- if .Values.metricsPlugins.enabled }}
        <xi:include href="etc/metrics.xml" />
        {{- end }}

        {{- range $key, $value := .Values.core }}
        <{{ kebabcase $key }}>{{ $value }}</{{ kebabcase $key }}>
        {{- end }}
      </core>
    </configuration>

  broker-ha-live.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="no"?>
    <configuration xmlns="urn:activemq" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="urn:activemq /schema/artemis-configuration.xsd" xmlns:xi="http://www.w3.org/2001/XInclude">
      <core xmlns="urn:activemq:core" xsi:schemaLocation="urn:activemq:core ">

        <xi:include href="etc/connectors.xml"/>
        <xi:include href="etc/acceptors.xml"/>

        <cluster-user>{{ .Values.auth.clusterUser }}</cluster-user>
        <xi:include href="etc/clustering.xml" />

        <xi:include href="etc/addresses.xml"/>
        <xi:include href="etc/address-settings.xml" />
        <xi:include href="etc/security-settings.xml" />
        <xi:include href="etc/broker-plugins.xml" />
        {{- if .Values.metricsPlugins.enabled }}
        <xi:include href="etc/metrics.xml" />
        {{- end }}

        <xi:include href="etc/ha-live.xml" />

        {{- range $key, $value := .Values.core }}
        <{{ kebabcase $key }}>{{ $value }}</{{ kebabcase $key }}>
        {{- end }}
      </core>
    </configuration>

  broker-ha-backup.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="no"?>
    <configuration xmlns="urn:activemq" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="urn:activemq /schema/artemis-configuration.xsd" xmlns:xi="http://www.w3.org/2001/XInclude">
      <core xmlns="urn:activemq:core" xsi:schemaLocation="urn:activemq:core ">

        <xi:include href="etc/connectors.xml"/>
        <xi:include href="etc/acceptors.xml"/>

        <cluster-user>{{ .Values.auth.clusterUser }}</cluster-user>
        <xi:include href="etc/clustering.xml" />

        <xi:include href="etc/addresses.xml"/>
        <xi:include href="etc/address-settings.xml" />
        <xi:include href="etc/security-settings.xml" />
        <xi:include href="etc/broker-plugins.xml" />
        {{- if .Values.metricsPlugins.enabled }}
        <xi:include href="etc/metrics.xml" />
        {{- end }}

        <xi:include href="etc/ha-backup.xml" />

        {{- range $key, $value := .Values.core }}
        <{{ kebabcase $key }}>{{ $value }}</{{ kebabcase $key }}>
        {{- end }}
      </core>
    </configuration>

  connectors.xml: |
    <connectors xmlns="urn:activemq:core">
      <connector name="netty">tcp://$EXTERNAL_IP:61616</connector>
      {{- if .Values.ha.enabled }}
      {{- range $i, $t := until (int .Values.replicaCount) }}
      {{- range tuple "" "-backup" }}
      <connector name="{{ $fullname }}{{ . }}-{{ $i }}">tcp://{{ $fullname }}{{ . }}-{{ $i }}.{{ $releaseName }}{{ . }}.{{ $releaseNamespace }}.svc.cluster.local:61616</connector>
      {{- end }}
      {{- end }}
      {{- end }}
    </connectors>

  acceptors.xml: |
    <acceptors xmlns="urn:activemq:core">
      {{- range $key, $value := .Values.acceptors }}
        {{- $configsList := list }}
        {{- if $value.configs }}
          {{- range $configKey, $configValue := $value.configs }}
              {{- $configsList = append $configsList (printf "%s=%s" $configKey (toString $configValue)) }}
          {{- end }}
        {{- end }}
      <acceptor name="{{ $key }}">{{ $value.url }}{{ if $configsList }}?{{ join ";" $configsList }}{{ end }}</acceptor>
      {{- end }}
    </acceptors>

  clustering.xml: |
    <cluster-connections xmlns="urn:activemq:core">
      <cluster-connection name="{{ include "artemis.fullname" . }}">
        <address>{{ .Values.clustering.addresses | join "," }}</address>
        <connector-ref>netty</connector-ref>
        <static-connectors>
          {{- range $i, $t := until (int .Values.replicaCount) }}
          {{- range tuple "" "-backup" }}
          <connector-ref>{{ $fullname }}{{ . }}-{{ $i }}</connector-ref>
          {{- end }}
          {{- end }}
        </static-connectors>
        {{- range $key, $value := (omit .Values.clustering "address" "addresses" "connector-ref" "static-connectors") }}
        <{{ kebabcase $key }}>{{ $value }}</{{ kebabcase $key }}>
        {{- end }}
      </cluster-connection>
    </cluster-connections>

  addresses.xml: |
    <addresses xmlns="urn:activemq:core">
    {{- range .Values.addresses }}
      <address name="{{ required "name is mandatory for each address" .name }}">
      {{- if eq "queue" (default "queue" .type) }}
        <anycast>
        {{- if .queues }}
            {{- range .queues }}
              <queue name="{{ . }}" />
            {{- end }}
        {{- else }}
            <queue name="{{ .name }}" />
        {{- end }}
        </anycast>
      {{- else if eq "topic" .type }}
        {{- if .queues }}
        <multicast>
          {{- range .queues }}
             <queue name="{{ . }}" />
          {{- end }}
        </multicast>
        {{- else }}
        <multicast />
        {{- end }}
      {{- else }}
        {{- fail "invald address type. Can only be 'queue' or 'topic'"}}
      {{- end }}
      </address>
    {{- end }}
    </addresses>

  address-settings.xml: |
    <address-settings xmlns="urn:activemq:core">
    {{- range .Values.addressSettings }}
       <address-setting match="{{ required "match is mandatory for each addressSetting" .match }}">
       {{- range $key, $value := .settings }}
        <{{ kebabcase $key }}>{{ $value }}</{{ kebabcase $key }}>
       {{- end }}
       </address-setting>
    {{- end }}
    </address-settings>

  security-settings.xml: |
    <security-settings xmlns="urn:activemq:core">
      {{- range .Values.securitySettings }}
      <security-setting match="{{ .match }}">
        {{- range $role, $permissions := .permissions }}
          {{- range $permission := $permissions }}
        <permission roles="{{ $role }}" type="{{ $permission }}"/>
          {{- end }}
        {{- end }}
      </security-setting>
      {{- end }}
    </security-settings>

  broker-plugins.xml: |
    <broker-plugins xmlns="urn:activemq:core">
        <broker-plugin class-name="org.apache.activemq.artemis.core.server.plugin.impl.LoggingActiveMQServerPlugin">
            <property key="LOG_ALL_EVENTS" value="true"/>
            <property key="LOG_CONNECTION_EVENTS" value="true"/>
            <property key="LOG_SESSION_EVENTS" value="true"/>
            <property key="LOG_CONSUMER_EVENTS" value="true"/>
            <property key="LOG_DELIVERING_EVENTS" value="true"/>
            <property key="LOG_SENDING_EVENTS" value="true"/>
            <property key="LOG_INTERNAL_EVENTS" value="true"/>
        </broker-plugin>
    </broker-plugins>

  metrics.xml: |
    <metrics xmlns="urn:activemq:core">
      {{- range .Values.metricsPlugins.plugins }}
      <plugin class-name="{{ .className }}">
        {{- range $key, $value := . }}
        {{- if ne $key "className" }}
        <property key="{{ $key }}" value="{{ $value }}" />
        {{- end }}
        {{- end }}
      </plugin>
      {{- end }}
    </metrics>

  ha-live.xml: |
    <ha-policy xmlns="urn:activemq:core">
      <replication>
          <master>
            <check-for-live-server>true</check-for-live-server>
            {{- range $key, $value := (omit .Values.ha.live "check-for-live-server" "checkForLiveServer") }}
            <{{ kebabcase $key }}>{{ $value }}</{{ kebabcase $key }}>
            {{- end }}
          </master>
      </replication>
    </ha-policy>

  ha-backup.xml: |
    <ha-policy xmlns="urn:activemq:core">
      <replication>
          <slave>
            <allow-failback>true</allow-failback>
            {{- range $key, $value := (omit .Values.ha.backup "allow-failback" "allowFailback") }}
            <{{ kebabcase $key }}>{{ $value }}</{{ kebabcase $key }}>
            {{- end }}
          </slave>
      </replication>
    </ha-policy>

  broker-00.xslt: |
    <xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

      <xsl:output omit-xml-declaration="yes"/>

      <xsl:template match="node()|@*">
        <xsl:copy>
         <xsl:apply-templates select="node()|@*"/>
        </xsl:copy>
      </xsl:template>

      <xsl:template match="*[local-name()='addresses']|*[local-name()='address-settings']"/>
    </xsl:stylesheet>
