nameOverride: ""
fullnameOverride: ""

# replica count for master brokers
replicaCount: 1

image:
# repository and image tag are required
  repository: apache/activemq-artemis
  tag: 2.39.0
  pullPolicy: IfNotPresent
  pullSecrets: []

initContainerImage:
  repository: bash
  tag: 5
  pullPolicy: IfNotPresent

# minimum memory and cpu limits/requests
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 300m
    memory: 512Mi

# javaOpts additional java options
# TODO: probably this will not work with official image
javaOpts: ""

# enable persistence for HA
persistence:
  enabled: false
  accessModes:
    - ReadWriteOnce
  storageSize: 8Gi
  storageClassName: exoscale-sbs

# livenessProbe:
  # httpGet:
  #   port: http
  # initialDelaySeconds: 120
  # periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: netty
  initialDelaySeconds: 5
  periodSeconds: 10

# TODO: this also will not work with official image
metrics:
  ## metrics.enabled if `true` export prometheus metrics
  enabled: true
  serviceMonitor:
    ## metrics.serviceMonitor.enabled if `true` and metrics.enabled `true` then deploy service monitor
    enabled: false
    ## metrics.serviceMonitor.namespace namespace where serviceMonitor is deployed
    namespace: monitoring
    ## metrics.serviceMonitor.path Prometheus scraping path
    path: /metrics
    ## metrics.serviceMonitor.interval Prometheus scraping interval
    interval: 10s

# TODO: move to metrics
metricsPlugins:
  enabled: false
  plugins:
    - className: com.pxl.activemq.artemis.ElasticMetricsPlugin
      host: http://elasticsearch-es-internal-http.eck-stack.svc.cluster.local:9200
      userName: elastic
      password: elasticPassword

# TODO: add this user to the artemis-users.properties
auth:
  clientUser: artemis
  clusterUser: artemis-internal
  # if not set, a random password will be generated and stored in a secret
  existingSecret: ""

## clustering settings, see: https://activemq.apache.org/components/artemis/documentation/latest/clusters.html for reference.
## All key-value pairs are automatically expanded in the cluster-connections xml
clustering:
  ## clustering.addresses prefix of addresses to include in clustering
  addresses: []
  ## clustering.useDuplicateDetection filter out duplicate messages
  useDuplicateDetection: true

ha:
  ## ha.enabled if `true` a second stateful set running backups will be installed
  enabled: false
  ## ha.live settings for live servers. Key, values are automatically expanded
  live: {}
  ## ha.backup settings for backup servers. Key, values are automatically expanded
  backup: {}

## core additional core settings. Key, values are automatically expanded
core:
  ## core.criticalAnalyzerPolicy how to behave on critical errors detected, see https://activemq.apache.org/components/artemis/documentation/latest/critical-analysis.html
  criticalAnalyzerPolicy: SHUTDOWN

acceptors:
  artemis:
    url: "tcp://0.0.0.0:61616"
    configs:
      tcpSendBufferSize: "1048576"
      tcpReceiveBufferSize: "1048576"
      amqpMinLargeMessageSize: "102400"
      protocols: "CORE,AMQP,STOMP,HORNETQ,MQTT,OPENWIRE"
      useEpoll: true
      amqpCredits: "1000"
      amqpLowCredits: "300"
      amqpDuplicateDetection: true
      supportAdvisory: false
      suppressInternalManagementObjects: false
  amqp:
    url: "tcp://0.0.0.0:5672"
    configs:
      tcpSendBufferSize: "1048576"
      tcpReceiveBufferSize: "1048576"
      amqpMinLargeMessageSize: "102400"
      protocols: "AMQP"
      useEpoll: true
      amqpCredits: "1000"
      amqpLowCredits: "300"
      amqpDuplicateDetection: true
  stomp:
    url: "tcp://0.0.0.0:61613"
    configs:
      tcpSendBufferSize: "1048576"
      tcpReceiveBufferSize: "1048576"
      protocols: "STOMP"
      useEpoll: true
  hornetq:
    url: "tcp://0.0.0.0:5445"
    configs:
      anycastPrefix: jms.queue.
      multicastPrefix: jms.topic.
      protocols: "HORNETQ,STOMP"
      useEpoll: true
  mqtt:
    url: "tcp://0.0.0.0:1883"
    configs:
      tcpSendBufferSize: "1048576"
      tcpReceiveBufferSize: "1048576"
      protocols: "MQTT"
      useEpoll: true

# TODO: check if this is needed
addresses:
  - name: DLQ
  - name: ExpiryQueue

# TODO: are the default values correct?
addressSettings:
  - match: "#"
    settings:
      deadLetterAddress: DLQ
      expiryAddress: ExpiryQueue
      messageCounterHistoryDayLimit: 10

# TODO: check default permissions
securitySettings:
  - match: '#'
    permissions:
      amq:
        - createAddress
        - deleteAddress
        - createDurableQueue
        - deleteDurableQueue
        - createNonDurableQueue
        - deleteNonDurableQueue
        - consume
        - send
        - browse

## users defines the Artemis users required by other applications.
# users:
#    johndoe:
#      user: johndoe
#      secretName: artemis-secret
#      secretKey: johndoe
#    testUser:
#      user: testUser
#      secretName: test-secret
#      secretKey: test

## user-role bindings required by other applications.
# roleBindings:
#   - role: amq
#     users:
#     - johndoe
#   - role: artemisRole1
#     users:
#     - johndoe
#     - testUser

users: {}

## podSecurityContext allows setting security context for the pod: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
# podSecurityContext:
## containerSecurityContext allows setting security context for the container: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
# containerSecurityContext:

nodeSelector: {}

tolerations: []

affinity: {}
