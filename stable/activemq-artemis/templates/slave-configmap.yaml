apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "artemis.fullname" . }}-configure-slave
  labels:
{{ include "artemis.labels.standard" . | indent 4 }}
data:

  template-slave-ha.xml: |
    <ha-policy xmlns="urn:activemq:core">
        <replication>
            <slave>
                <group-name>to-be-set-by-configure-cluster.sh</group-name>
                <allow-failback>true</allow-failback>
                <!-- not needed but tells the backup not to restart after failback as there will be > 0 backups saved -->
                <max-saved-replicated-journals-size>0</max-saved-replicated-journals-size>
            </slave>
        </replication>
    </ha-policy>

  configure-cluster.sh: |
    
    {{ $name := default .Chart.Name .Values.nameOverride }}
    {{ $releaseName := printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}

    MASTERNAME=$(echo ${HOSTNAME} | sed -re 's/-slave/-master/g')

    set -e
    echo Copying common configuration
    # cp /opt/configure-common/template-common.xml /var/lib/artemis-instance/etc-override/broker-10.xml
    cp /opt/configure-common/template-common.xml /var/lib/artemis-instance/etc-override/broker.xml

    echo Assigning node as slave
    cp /opt/configure-slave/template-slave-ha.xml /var/lib/artemis-instance/etc-override/broker-ha.xml

    GROUPNAME=$(echo ${HOSTNAME} | sed -re 's/(-slave|-master)//')
    echo Setting the group-name for slave to ${GROUPNAME}
    xmlstarlet ed -L \
    -N core="urn:activemq:core" \
    -u "/core:ha-policy/core:replication/core:slave/core:group-name" \
    -v "${GROUPNAME}" /var/lib/artemis-instance/etc-override/broker-ha.xml

    echo Setting the connector-ref to ${HOSTNAME}
    xmlstarlet ed -L \
    -N activemq="urn:activemq" \
    -N core="urn:activemq:core" \
    -u "/activemq:configuration/core:core/core:cluster-connections/core:cluster-connection[@name='{{ $releaseName }}']/core:connector-ref" \
    -v "${HOSTNAME}" /var/lib/artemis-instance/etc-override/broker.xml